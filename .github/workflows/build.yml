# Compila y prueba las versiones de Windows y macOS y genera sus instaladores.
# Se ejecuta en cada push a main y, al publicar una etiqueta vX.Y.Z, adjunta el instalador
# y el ZIP portable a la versión (Release) de GitHub.
#
# Seguridad de la cadena de suministro:
# - Las acciones van fijadas por commit (SHA), no por etiqueta, para que no cambien sin aviso.
# - Los trabajos de compilación solo pueden leer el repositorio; el permiso de escritura lo
#   tiene únicamente el trabajo final de publicación, que solo se ejecuta con etiquetas y sube
#   los archivos con la herramienta gh oficial (sin acciones de terceros).
name: Compilación

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Pruebas
        run: dotnet test windows/Astrolabio.Tests -c Release
      - name: Publicar (win-x64, autónomo)
        run: dotnet publish windows/Astrolabio.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows/publish/win-x64
      - name: Versión
        id: ver
        shell: bash
        # La versión sale del proyecto (windows/Directory.Build.props), no del nombre de la rama.
        run: echo "v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - name: ZIP portable
        shell: pwsh
        run: Compress-Archive -Path windows/publish/win-x64/* -DestinationPath "windows/publish/Astrolabio-${{ steps.ver.outputs.v }}-Windows-portable.zip"
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" windows/installer/Astrolabio.iss
      - name: Sumas SHA-256
        shell: pwsh
        run: Get-ChildItem windows/publish/*.exe, windows/publish/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii windows/publish/SHA256-Windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Astrolabio-Windows
          path: |
            windows/publish/*.exe
            windows/publish/*.zip
            windows/publish/SHA256-Windows.txt

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pruebas
        run: swift test
      - name: DMG
        run: ./scripts/make_dmg.sh
      - name: Suma SHA-256
        run: cd dist && shasum -a 256 *.dmg > SHA256-macOS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Astrolabio-macOS
          path: |
            dist/*.dmg
            dist/SHA256-macOS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar en la versión
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Astrolabio ${TAG#v}" --notes "Astrolabio ${TAG#v}"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
